<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucid — Incidents</title>
    <meta name="description" content="Local-first Lucid. Real incidents from agent runs. No accounts.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Lucid</span>
        </div>
        <nav class="nav" id="nav">
          <a class="nav-item is-active" data-route="incidents" href="#/incidents">Incidents</a>
        </nav>
        <div class="sidebar-foot">
          <p class="system-status" id="system-status">
            <span class="status-dot" aria-hidden="true"></span>
            System: ✓ Lucid running
          </p>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <p class="crumb" id="crumb">Incidents</p>
          <p class="topbar-note">Local · no accounts</p>
        </header>
        <main class="content" id="content" aria-live="polite"></main>
      </div>
    </div>

    <p id="boot-error" class="boot-error" role="alert" hidden>
      Lucid could not load. Confirm <code>npm run web</code> is running on this machine.
    </p>
  </body>
</html>
